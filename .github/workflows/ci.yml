name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One Python failing must not cancel the others: we want the full
      # matrix verdict on every run (3.10 is the floor, 3.11 is the
      # locally-tested version, 3.12 is the ceiling).
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The frontend harness subclasses Node's built-in WebSocket global,
      # which only exists by default from Node 21 (Node 20 is EOL).
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Zero-cost syntax gate: catch a broken harness before the slower
      # Python steps (validates whatever version is checked out).
      - name: Frontend harness syntax check
        run: node --check tests/frontend_harness.js

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Static compile gate
        run: python -m compileall -q backend tests training docs

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Prepare feeder auth store
        run: |
          rm -rf "$RUNNER_TEMP/lg_ci"
          mkdir -p "$RUNNER_TEMP/lg_ci"
          echo "LIVEGUARD_DATA_DIR=$RUNNER_TEMP/lg_ci" >> "$GITHUB_ENV"

      - name: Start harness feeder
        run: |
          nohup python tests/harness_feeder.py 8766 > feeder.log 2>&1 &
          echo $! > feeder.pid
          for i in $(seq 1 60); do
            if grep -q "harness feeder listening" feeder.log 2>/dev/null; then
              echo "feeder ready"
              exit 0
            fi
            sleep 1
          done
          echo "feeder did not become ready within 60s"
          cat feeder.log || true
          exit 1

      - name: Frontend harness
        run: node tests/frontend_harness.js ws://127.0.0.1:8766

      # feeder.log is only cat-ed on the readiness-failure path above;
      # dump it on ANY failure so harness errors are debuggable too.
      - name: Dump feeder log on failure
        if: failure()
        run: cat feeder.log || true

      - name: Stop feeder
        if: always()
        run: |
          if [ -f feeder.pid ]; then
            kill "$(cat feeder.pid)" 2>/dev/null || true
          fi
          pkill -f "tests/harness_feeder.py" 2>/dev/null || true

  # The project is developed on Windows (PowerShell commands are documented
  # in the README), so run the same gates on a Windows runner as well --
  # Python 3.11 is the locally-developed version.
  test-windows:
    name: Test (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Frontend harness syntax check
        run: node --check tests/frontend_harness.js

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Static compile gate
        run: python -m compileall -q backend tests training docs

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Prepare feeder auth store
        # ${{ runner.temp }} is not available at job-level env, so derive
        # the dir from the runner's native RUNNER_TEMP and publish it to
        # subsequent steps via GITHUB_ENV.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lg_ci_win"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir | Out-Null
          "LIVEGUARD_DATA_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The feeder lives in the SAME step as the harness: a process started
      # in a previous step can be reaped when that step's shell exits
      # (observed on windows-latest), which refused every socket and made
      # the harness time out on its first frame. Start -> probe -> run ->
      # always stop, in one process tree.
      - name: Frontend harness
        run: |
          $p = Start-Process -FilePath python `
            -ArgumentList "tests/harness_feeder.py","8766" `
            -WorkingDirectory (Get-Location) `
            -RedirectStandardOutput "feeder.log" `
            -RedirectStandardError "feeder.err" `
            -PassThru -NoNewWindow
          $p.Id | Set-Content feeder.pid
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ((Test-Path feeder.log) -and
                  (Select-String -Path feeder.log -Pattern "harness feeder listening" -Quiet -ErrorAction SilentlyContinue)) {
                $ready = $true
                break
              }
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Write-Output "feeder did not become ready within 60s"
              if (Test-Path feeder.log) { Get-Content feeder.log -ErrorAction SilentlyContinue }
              if (Test-Path feeder.err) { Get-Content feeder.err -ErrorAction SilentlyContinue }
              exit 1
            }
            # Prove the port is reachable BEFORE node runs: a future failure
            # then reports "port NOT reachable" instead of a bare timeout.
            python -c "import socket; s = socket.create_connection(('127.0.0.1', 8766), 5); s.close(); print('port 8766 reachable')"
            if ($LASTEXITCODE -ne 0) {
              Write-Output "feeder port NOT reachable"
              if (Test-Path feeder.err) { Get-Content feeder.err -ErrorAction SilentlyContinue }
              exit 1
            }
            node tests/frontend_harness.js ws://127.0.0.1:8766
            exit $LASTEXITCODE
          } finally {
            if ($p -and -not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # Full feeder log + stderr on ANY failure of the step above.
      - name: Dump feeder log on failure
        if: failure()
        run: |
          if (Test-Path feeder.log) { Get-Content feeder.log }
          if (Test-Path feeder.err) { Get-Content feeder.err }

      - name: Stop feeder
        if: always()
        run: |
          if (Test-Path feeder.pid) {
            Stop-Process -Id (Get-Content feeder.pid) -Force -ErrorAction SilentlyContinue
          }
